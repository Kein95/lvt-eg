[project]
name = "lvt-eg"
version = "0.1.0"
description = "LVT-EG: SVTRv2 + Visual-Tactile Edge Branch for License Plate Recognition"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["license-plate-recognition", "svtrv2", "edge-guided", "ocr", "ctc", "visual-tactility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "timm>=0.9.0",
    "albumentations>=1.3.0",
    "opencv-python-headless>=4.7.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "matplotlib>=3.7.0",
    "einops>=0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]
download = [
    "gdown>=5.0.0",
]

[project.scripts]
lvt-eg-train = "lvt_eg.scripts.train:main"
lvt-eg-eval  = "lvt_eg.scripts.evaluate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lvt_eg"]

[tool.hatch.build.targets.sdist]
include = ["src/", "configs/", "assets/", "data/README.md", "data/datahub/", "results/README.md"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100
 
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["lvt_eg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"
