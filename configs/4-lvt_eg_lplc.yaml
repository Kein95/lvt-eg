# LVT-EG on LPLC (Brazil, 12,687 annotated plates; readable subset used for CV)
# Paper Sec 4.1: 5-fold cross-validation repeated twice
# Batch size 256 = recipe used to produce paper results (Colab A100 80GB / High-RAM).
# Lower to 64 if GPU VRAM is limited.
run_name: lvt_eg_lplc
seed: 42

dataset:
  key: lplc
  chars: "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ"
  num_classes: 37
  img_h: 48
  img_w: 192
  hr_h: 64
  hr_w: 256
  synth_policy: v2
  cv:
    folds: 5
    repeats: 2

model:
  arch: lvt_eg
  use_stn: true
  drop_path: 0.2
  use_pos_embed: true

loss:
  ctc_weight: 1.0
  edge_l1_weight: 0.1

train:
  epochs: 30
  batch_size: 256               # paper recipe (A100 80GB); lower to 64 if VRAM limited
  optimizer: adamw
  weight_decay: 0.02
  scheduler: onecycle
  max_lr: 3.0e-4
  pct_start: 0.3
  amp: true
  ema_decay: 0.99
  grad_clip: 5.0
  patience: 10
  ema_warmup_epochs: 5         # epochs=30 → warmup=5 (epochs=50 → 10)
  early_stop_metric: val_plate_rr

eval:
  metric: plate_rr
  per_legibility_report: true
