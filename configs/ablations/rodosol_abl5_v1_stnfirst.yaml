# Ablation Table VI, row 5 "Synthetic v1 + STN-first": dp 0.2, synth v1, edge, STN-first
# RodoSol recipe (48x192). Paper reports 97.63 (2 runs).
run_name: rodosol_abl5_v1_stnfirst
seed: 42

dataset:
  key: rodosol
  chars: "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ"
  num_classes: 37
  img_h: 48
  img_w: 192
  hr_h: 64
  hr_w: 256
  synth_policy: v1

model:
  arch: lvt_eg
  use_stn: true
  drop_path: 0.2
  use_pos_embed: true
  use_edge: true
  stn_order: stn_first

loss:
  ctc_weight: 1.0
  edge_l1_weight: 0.1

train:
  epochs: 50
  batch_size: 64
  optimizer: adamw
  weight_decay: 0.02
  scheduler: onecycle
  max_lr: 3.0e-4
  pct_start: 0.3
  amp: true
  ema_decay: 0.99
  grad_clip: 5.0
  patience: 15
  ema_warmup_epochs: 10
  early_stop_metric: val_plate_rr

eval:
  metric: plate_rr
